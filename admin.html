<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veloura Reservation Admin</title><style>body{margin:0;background:#0b0b0a;color:#eee;font:14px Arial}.wrap{max-width:1200px;margin:auto;padding:40px 20px}h1{font:42px Georgia;color:#d1ad70;margin-bottom:5px}.sub{color:#999}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.btn{border:1px solid #806a47;background:#caa76b;padding:10px 15px;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:30px;background:#131311}th,td{padding:13px;border-bottom:1px solid #2d2b27;text-align:left;vertical-align:top}th{color:#caa76b;font-size:11px;text-transform:uppercase}.status{padding:5px 8px;background:#26231d;border:1px solid #4d4332;color:#d9bd8b}.empty{padding:40px;text-align:center;color:#888;background:#131311;margin-top:30px}@media(max-width:800px){.scroll{overflow:auto}table{min-width:900px}}</style></head><body><div class="wrap"><div class="top"><div><h1>Reservation Admin</h1><div class="sub">Demo dashboard — bookings submitted on index.html appear here in this browser.</div></div><button class="btn" onclick="clearAll()">Clear Demo Data</button></div><div id="out"></div></div><script>function render(){let a=JSON.parse(localStorage.getItem('velouraBookings')||'[]'),o=document.querySelector('#out');if(!a.length){o.innerHTML='<div class="empty">No reservations yet. Open index.html and submit the reservation form.</div>';return}o.innerHTML='<div class="scroll"><table><thead><tr><th>Ref</th><th>Guest</th><th>Date / Time</th><th>Guests</th><th>Contact</th><th>Notes</th><th>Status</th></tr></thead><tbody>'+a.map(x=>`<tr><td>${x.id}<br><small>${x.created}</small></td><td><b>${x.name}</b></td><td>${x.date}<br>${x.time}</td><td>${x.guests}</td><td>${x.phone}<br>${x.email}</td><td>${x.notes||'—'}</td><td><span class="status">${x.status}</span></td></tr>`).join('')+'</tbody></table></div>'}function clearAll(){if(confirm('Clear all demo reservations?')){localStorage.removeItem('velouraBookings');render()}}render()</script></body></html>
